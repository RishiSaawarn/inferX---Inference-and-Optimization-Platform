postgres:
  url: !!python/object/apply:os.getenv ["DATABASE_URL", "postgresql://postgres:postgres@localhost:5432/inferx"]

redis:
  url: !!python/object/apply:os.getenv ["REDIS_URL", "redis://localhost:6379"]
  ttl: 3600

routing:
  latency_weight: 0.4
  accuracy_weight: 0.6

batching:
  enabled: true
  max_batch_size: 16
  max_wait_ms: 10

canary:
  percentage: 5

rollback:
  latency_multiplier: 1.25
  max_error_rate: 0.02
  min_samples: 10
