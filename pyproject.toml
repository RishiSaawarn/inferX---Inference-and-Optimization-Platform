[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferx"
version = "0.1.0"
description = "Production AI Inference & Optimization Platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "torch",
    "torchvision",
    "onnx",
    "onnxruntime",
    "redis",
    "psycopg2-binary",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "pyyaml"
]

[project.scripts]
inferx = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "locust",
    "httpx"
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
